name: Terraform Plan

# Two deploy paths write the same S3 objects: this repo's "Upload Website"
# workflow, and `terraform apply`. If their settings drift apart - a
# cache_control string, a content_type guess - each silently reverts the other
# on its next run. A clean plan is the only thing that detects it.
#
# So this runs a plan and treats "there are changes" as a failure on main,
# where a freshly deployed site should already match the config.

on:
  # After a deploy, not alongside it. A plan racing the s3 sync would compare
  # against a half-uploaded site and report drift that is not real.
  workflow_run:
    workflows: ["Upload Website"]
    types: [completed]

  # Catches drift introduced outside this repo - a console edit, a lifecycle
  # rule someone added by hand.
  schedule:
    - cron: '17 6 * * 1'

  pull_request:
    paths:
      - '**.tf'
      - 'website/**'
      - 'errors/**'
      - '.github/workflows/terraform-plan.yml'

  workflow_dispatch:

  # Called by "Upload Website" as a gate. In that mode changes are expected -
  # every content edit changes an object's etag - so only a plan that errors
  # blocks the deploy.
  workflow_call:
    inputs:
      mode:
        type: string
        default: drift

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest

    # Nothing to check if the deploy itself failed, and fork PRs cannot read
    # the AWS secrets - without this they fail confusingly on every run.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          # The wrapper reformats stdout, which would defeat the redaction
          # below by echoing plan output into the public job log.
          terraform_wrapper: false

      # No `terraform fmt -check` step on purpose: lambda.tf, main.tf and
      # records.tf are not canonically formatted, so it would fail every run for
      # reasons that have nothing to do with drift. Add it after a `terraform
      # fmt -recursive` cleanup if you want the gate.

      - name: Init
        run: terraform init -input=false -lock=false

      - name: Validate
        run: terraform validate -no-color

      # -lock=false so a plan here cannot block an apply from a laptop.
      #
      # Plan output goes to a file, never the log: this repo is public and run
      # logs are world-readable. Never echo plan.txt, and never upload tfplan as
      # an artifact - it embeds state values.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color \
            -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 1 ]; then
            # Nothing is copied out of the error text - an AWS error carries
            # ARNs, the account id and resource ids. Only three shapes are
            # matched, none of which can contain an identifier: error codes from
            # a known list, service:Action names, and the resource type before
            # the "(id)". Redacting free text instead was tried twice and leaked
            # both times.
            codes=$(grep -hoE '\b(AccessDenied|ExpiredToken|InvalidClientTokenId|UnauthorizedOperation|Throttling|RequestTimeTooSkewed|NoCredentialProviders)\b' plan.txt | sort -u)
            actions=$(grep -hoE 'is not authorized to perform: [a-zA-Z0-9-]+:[A-Za-z]+' plan.txt \
                      | sed -E 's/.*perform: //' | sort -u)
            types=$(grep -hoE '^Error: reading [A-Za-z0-9 ]+ \(' plan.txt \
                    | sed -E 's/^Error: reading //; s/ \($//' | sort -u)
            nerr=$(grep -c '^Error:' plan.txt || true)

            # paste, not `echo $var` - types contain spaces ("Route53 Hosted
            # Zone") and word-splitting would list each word separately.
            join() { paste -sd'|' - | sed 's/|/, /g'; }

            diag="${nerr:-0} errors"
            [ -n "$codes" ]   && diag="$diag"$'\n'"codes: $(printf '%s\n' "$codes" | join)"
            [ -n "$types" ]   && diag="$diag"$'\n'"failed to read: $(printf '%s\n' "$types" | join)"
            [ -n "$actions" ] && diag="$diag"$'\n'"denied: $(printf '%s\n' "$actions" | join)"

            echo "::error::terraform plan failed"
            while IFS= read -r line; do
              echo "::error::${line}"
            done <<< "$diag"

            {
              echo "### Terraform plan failed"
              echo
              echo "Identifiers are stripped and the full output is not retained -"
              echo "this repository is public and run logs are world-readable."
              echo "Run \`terraform plan\` locally with credentials to see it all."
              echo
              echo '```'
              echo "$diag"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          changes=""
          if [ "$code" -eq 2 ]; then
            changes=$(terraform show -no-color tfplan \
                      | grep -E '^  # |^Plan: ' \
                      | sed -E 's/[0-9]{12}/<account>/g')
          fi

          {
            echo "### Terraform plan"
            echo
            if [ "$code" -eq 0 ]; then
              echo "No changes. The deployed site matches the config."
            else
              echo "**Changes detected.** Resource addresses only - full diffs are"
              echo "withheld because this repository is public."
              echo
              echo '```'
              echo "$changes"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations too: a summary only renders on the run page, but
          # annotations come back from the checks API. Resource addresses are
          # the same names the .tf files already carry in public.
          if [ "$code" -eq 2 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::notice::${line}"
            done <<< "$changes"
          fi

      # On a pull request, changes are the point - the plan is there to be read.
      # On main after a deploy, or on the weekly run, changes mean the two paths
      # have drifted and someone needs to look.
      - name: Fail on drift
        if: >-
          steps.plan.outputs.exitcode == '2' &&
          github.event_name != 'pull_request' &&
          inputs.mode != 'gate'
        run: |
          echo "::error::Deployed site does not match the terraform config."
          echo "See the job summary for which resources differ."
          exit 1

      - name: Remove the plan file
        if: always()
        run: rm -f tfplan plan.txt
