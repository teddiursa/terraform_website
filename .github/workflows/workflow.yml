name: Upload Website

on:
  push:
    branches:
    - main

jobs:
  # Nothing reaches the bucket until both of these pass. The sync itself has no
  # opinion about what it uploads - it will happily publish a page whose script
  # tag points at a file that does not exist.
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Check every referenced file will be deployed
      run: python3 scripts/check_assets.py

  # Catches a config that no longer plans, or credentials that have expired,
  # before anything is written. Changes are expected here and do not block:
  # every content edit changes an object's etag, so a gate that demanded a
  # clean plan would mean never deploying again. Drift is checked after the
  # deploy instead, by the same workflow running in its default mode.
  plan:
    uses: ./.github/workflows/terraform-plan.yml
    with:
      mode: gate
    secrets: inherit

  deploy:
    needs: [checks, plan]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # --metadata only writes x-amz-meta-* keys, never the real header. The
    # Content-Encoding values here described these files as gzipped when
    # nothing in this pipeline compresses anything.
    - name: Deploy image files to S3
      run: |
        aws s3 sync ./website/ s3://www.gregchow.net --delete \
          --exclude "*" \
          --include "*.png" --include "*.webp" --include "*.ico" \
          --cache-control max-age=86400,public

    - name: Deploy website files
      run: |
        aws s3 sync ./website/ s3://www.gregchow.net \
          --exclude ".vs*" \
          --exclude "desktop.ini" \
          --exclude "*.png" \
          --exclude "*.webp" \
          --exclude "*.ico" \
          --cache-control max-age=86400,public

    - name: Sync files to S3 (./errors/)
      run: |
        aws s3 sync ./errors/ s3://www.gregchow.net \
          --exclude ".vs*" \
          --exclude "desktop.ini" \
          --exclude "*.png" \
          --exclude "*.webp" \
          --exclude "*.ico" \
          --cache-control max-age=86400,public

    # ::set-output was disabled by GitHub in 2023, so this step kept passing
    # while producing an empty URL and the refresh below curled nothing.
    - name: Get url for the CloudFront cache refresh Lambda
      id: get-urlCache
      run: |
        urlCache=$(curl -sf https://s3.amazonaws.com/gregchow.jsonbucket/links.json | jq -r '.urlCache')
        if [ -z "$urlCache" ] || [ "$urlCache" = "null" ]; then
          echo "::error::urlCache missing from links.json"
          exit 1
        fi
        echo "urlCache=$urlCache" >> "$GITHUB_OUTPUT"

    - name: Refresh the CloudFront distribution
      run: |
        curl -sf -o /dev/null "${{ steps.get-urlCache.outputs.urlCache }}"
        curl -sf -o /dev/null https://gregchow.net
