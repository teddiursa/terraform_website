  <path class="head auto" d="M-5 -4 Q5 0 -5 4" transform="translate(376 572)"/>
  <text class="lbl" x="326" y="556">git push</text>
  <path class="e auto" d="M648 572 H732"/>
  <path class="head auto" d="M-5 -4 Q5 0 -5 4" transform="translate(740 572)"/>
  <text class="lbl" x="690" y="556">runs</text>
  <path class="e auto" d="M1012 572 H1096"/>
  <path class="head auto" d="M-5 -4 Q5 0 -5 4" transform="translate(1104 572)"/>
  <text class="lbl" x="1054" y="556">provisions</text>

  <path class="e auto" d="M1243 166 V244 H240 V274"/>
  <path class="head auto" d="M-5 -4 Q5 0 -5 4" transform="translate(240 282) rotate(90)"/>
