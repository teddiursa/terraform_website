  <text class="t" x="151" y="126">Internet</text>
  <text class="s" x="151" y="148">visitor</text>
  <rect class="n" x="388" y="62" width="254" height="96" rx="7"/>
  <text class="t" x="515" y="108">Route 53</text>
  <text class="s" x="515" y="133">points at CloudFront</text>
  <rect class="n" x="752" y="62" width="254" height="96" rx="7"/>
  <text class="t" x="879" y="108">CloudFront</text>
  <text class="s" x="879" y="133">ACM certificate</text>
  <g class="cyl"><rect x="1116" y="74" width="254" height="71"/>
  <ellipse cx="1243" cy="145" rx="127" ry="12"/></g>
  <ellipse class="cyl-lid" cx="1243" cy="74" rx="127" ry="12"/>
  <text class="t" x="1243" y="110">S3</text>
