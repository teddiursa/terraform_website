<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="846" viewBox="0 0 1400 846" role="img"
     aria-label="gregchow.net on AWS in three planes. Delivery: a visitor resolves the name at Route 53, which points at CloudFront; CloudFront serves over HTTPS with an ACM certificate and pulls the site files from an S3 bucket. Dynamic calls: home.js reads the API URLs from a JSON file in that bucket, calls API Gateway, which invokes Lambda functions that read and write the visitor counter in DynamoDB. Pipeline: a push to the GitHub repository runs GitHub Actions, whose runner syncs S3 and calls the API to clear the CloudFront cache, while Terraform builds every resource; Terraform keeps its state in a versioned S3 bucket and takes a DynamoDB lock while applying, so the project can be applied from any machine and never by two at once.">
  <title>gregchow.net on AWS: delivery, dynamic calls, pipeline</title>

  <rect width="1400" height="846" rx="8" fill="#171819"/>

  <defs>
    <style>
      .n     { fill:#202123; stroke:#383835; stroke-width:1.5; }
      .zone  { fill:#1a1b1d; stroke-width:1.5; stroke-dasharray:7 6; }
      .z-green { stroke:#199e6e; fill:#151d19; }  .z-green-t  { fill:#50b98b; }
      .z-purple{ stroke:#8353d4; fill:#1c1a21; }  .z-purple-t { fill:#aa91e4; }
      .z-orange  { stroke:#d8592b; fill:#211916; }  .z-orange-t   { fill:#e18768; }
      .cloud { fill:#242f40; stroke:#3a4e6c; stroke-width:1.5; }
      .cyl { fill:#1d2a2d; }
      .cyl-lid { fill:#283f4a; stroke:#14799c; stroke-width:1.5; }
      .t     { fill:#e4e6eb; font-family:sans-serif; font-size:25px; font-weight:600; text-anchor:middle; }
      .s     { fill:#8f9296; font-family:sans-serif; font-size:18px; text-anchor:middle; }
      .zt    { font-family:sans-serif; font-size:19px; font-weight:700; text-anchor:start; letter-spacing:.06em; }
      .lbl   { fill:#b0b3b8; font-family:sans-serif; font-size:17px; text-anchor:middle; }
      .e     { fill:none; stroke-width:3.5; stroke-linecap:round; }
      .head  { fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
      .web { stroke:#199e6e; }
      .api { stroke:#8353d4; }
      .auto { stroke:#d8592b; }
    </style>
  </defs>

