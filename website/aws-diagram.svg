  <text class="t" x="879" y="570">Runner</text>
  <text class="s" x="879" y="595">syncs S3, clears cache</text>
  <rect class="n" x="1116" y="524" width="254" height="96" rx="7"/>
  <text class="t" x="1243" y="570">Terraform</text>
  <text class="s" x="1243" y="595">builds every resource</text>
