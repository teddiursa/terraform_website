  <rect class="n" x="24" y="294" width="254" height="96" rx="7"/>
  <text class="t" x="151" y="340">home.js</text>
  <text class="s" x="151" y="365">reads URLs from S3</text>
  <rect class="n" x="388" y="294" width="254" height="96" rx="7"/>
  <text class="t" x="515" y="340">API Gateway</text>
