  <path class="head web" d="M-5 -4 Q5 0 -5 4" transform="translate(376 110)"/>
  <text class="lbl" x="326" y="94">resolve</text>
  <path class="e web" d="M648 110 H732"/>
  <path class="head web" d="M-5 -4 Q5 0 -5 4" transform="translate(740 110)"/>
  <text class="lbl" x="690" y="94">HTTPS</text>
  <path class="e web" d="M1012 110 H1096"/>
  <path class="head web" d="M-5 -4 Q5 0 -5 4" transform="translate(1104 110)"/>
