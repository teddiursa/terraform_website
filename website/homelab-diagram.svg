<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img"
     aria-label="Home lab network by VLAN. A router and firewall trunks four VLANs from the internet. Client devices and a dev VLAN running Code Server and EVE-NG reach services over HTTPS through an Nginx reverse proxy with Let's Encrypt certificates. The services VLAN runs that proxy, a Docker host, Plex, Vaultwarden, Watchtower and a Homepage dashboard. The management VLAN runs the Proxmox hypervisor which is also the local NTP server, a TrueNAS box taking media and Syncthing backups, Pi-hole serving DNS to every VLAN, Prometheus scraping each service API with Grafana on top, and Graylog and LibreNMS taking syslog and SNMP traps. WireGuard and Tailscale provide remote access, and Ansible provisions every container and VM.">
  <title>Home lab: VLAN segmentation and the paths between</title>

  <rect width="1400" height="720" rx="8" fill="#171819"/>

