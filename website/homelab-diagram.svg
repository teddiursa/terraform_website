      .z-blue{ stroke:#3789fd; fill:#171b22; }  .z-blue-t   { fill:#72a3ec; }
      .z-orange{ stroke:#d8592b; fill:#211916; }  .z-orange-t   { fill:#e18768; }
      .z-green{stroke:#199e6e; fill:#151d19; }  .z-green-t  { fill:#50b98b; }
      .z-purple{stroke:#8353d4;fill:#1c1a21; }  .z-purple-t { fill:#aa91e4; }
      .cloud { fill:#242f40; stroke:#3a4e6c; stroke-width:1.5; }
      .cyl   { fill:#202123; }
      .cyl-lid { fill:#2a2c30; stroke:#4a4b4d; stroke-width:1.5; }
      .t     { fill:#e4e6eb; font-family:sans-serif; font-size:25px; font-weight:600; text-anchor:middle; }
      .s     { fill:#8f9296; font-family:sans-serif; font-size:18px; text-anchor:middle; }
      .zt    { font-family:sans-serif; font-size:19px; font-weight:700; text-anchor:start; letter-spacing:.06em; }
      .lbl   { fill:#b0b3b8; font-family:sans-serif; font-size:17px; text-anchor:middle; }
      .key   { fill:#8f9296; font-family:sans-serif; font-size:18px; text-anchor:start; }
      .e     { fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
      .head  { fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
